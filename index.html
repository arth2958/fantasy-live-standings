<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b35"><title>Lichess4545 fantasy league</title></head>
<!-- This page only forwards to the latest season's standings. It reads the
     FANTASY_SEASONS list in seasons.js, so it needs NO per-season edit:
     adding the new season line there (see SEASON-FLIP.md) updates this
     redirect automatically. -->
<body>
<p>Taking you to the latest season&hellip; <a id="go" href="s50/">Continue to the standings</a></p>
<script src="seasons.js?v=13"></script>
<script>
(function(){
  var latest = FANTASY_SEASONS.filter(function(s){ return !!s.standings; })
                              .sort(function(a,b){ return b.n - a.n; })[0];
  if (!latest) return;
  document.getElementById('go').href = latest.standings;
  location.replace(latest.standings);
})();
</script>
</body></html>
