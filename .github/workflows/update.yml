name: Update standings
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Archived seasons are immutable and must not run here. At rollover,
      # freeze the final artifact as data/standings-s<NN>.json, point the
      # archived s<NN>/ view at it, then replace this command with the new
      # season generator and update the git add path below.
      - run: python scripts/update_s50.py
      - name: Commit changed data
        run: |
          git config user.name "standings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/standings-s50.json
          git diff --cached --quiet || git commit -m "Update standings"
          # A human push can land between this job's checkout and its push;
          # a plain "git push" then fails and the whole run goes red. Rebase
          # onto the newer main and retry once. -X theirs keeps this job's
          # freshly computed standings on any conflict, which is correct: the
          # regenerated data is newer than whatever it conflicts with.
          git push || (git pull --rebase -X theirs && git push)
