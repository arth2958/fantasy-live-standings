name: Update standings
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update.py
      - name: Commit changed data
        run: |
          git config user.name "standings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/standings.json
          git diff --cached --quiet || git commit -m "Update standings"
          git push
