name: Update S50 prices
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_prices.py
      - name: Commit changed data
        run: |
          git config user.name "standings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices-s50.json
          git diff --cached --quiet || git commit -m "Update S50 player prices"
          git push
