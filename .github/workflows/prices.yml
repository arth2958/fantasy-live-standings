name: Update S50 prices
on:
  workflow_dispatch:  # manual only: repricing is Leo's decision, never automatic
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Watch mode: recomputes only when roster composition changes.
      - run: python scripts/build_prices.py
      - name: Commit changed data
        run: |
          git config user.name "standings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices-s50.json data/ratings-s50-snapshot.json
          if ! git diff --cached --quiet; then
            if [ -s .prices-diff.txt ]; then git commit -F .prices-diff.txt; else git commit -m "Update S50 player prices"; fi
            git push
          fi
