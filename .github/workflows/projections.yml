name: Update projections
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/update_projections.py
      - name: League player detail (optional)
        continue-on-error: true
        run: python scripts/build_league_players.py
      - name: Commit projection artifact only
        run: |
          git config user.name "projection-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/projections-s50.json
          git add data/league-s50.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update projections"
          git push || (git pull --rebase -X theirs && git push)
